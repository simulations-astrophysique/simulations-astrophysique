[project]
site_url = "https://cours-alexandre-ouellet.github.io/simulations"
site_name = "360-4B4-VI Simulations en astrophysique"
site_description = "Notes de cours du cours de 360-4B4-VI Simulations en astrophysique"
site_author = "Alexandre Ouellet"

copyright = "CC BY-NC-SA | 2026 | Alexandre Ouellet"

nav = [
  { "Accueil" = "index.md" },

  { "Programmation en python" = [
    { "Révision" = "programmer/revision.md" },
    { "Révision Python - liste, numpy et matplotlib" = "programmer/revision_numpy_collection.md" },
  ]},
  { "Méthodes numériques" = [ 
    { "Méthodes numériques" = "algo/methodes_numeriques.md" },
    { "Méthode d'Euler" = "algo/methode_euler.md" },
    { "Méthode d'Euler avec deux équations" = "algo/methode_euler_2_eq.md" },
    { "Méthode de Runge-Kutta d'ordre 4" = "algo/rk4.md" },
    { "Erreurs théoriques des méthodes" = "algo/erreurs_methodes.md" }
  ]},
  { "Godot" = [
    { "Interface et concepts de base" = "godot/interface-godot.md" },
    { "Exemple : Orbite analytique et numérique de Vénus" = [
      { "Création de la scène" = "godot/creer-scene.md" },
      { "Mouvement analytique de Vénus" = "godot/mouvement-analytique.md" },
      { "Réutiliser un script" = "godot/reutiliser-script.md" },
      { "Mettre à l'échelle pour l'utilisation des valeurs réelles" = "godot/mise-a-lechelle.md" },
      { "Mouvement simulé de Vénus" = "godot/mouvement-simule.md" },
      { "Création de l'interface" = "godot/creation-interface.md" },
      { "Dispositifs de saisie" = "godot/dispositifs-saisie.md" }
    ]},
    { "Autres fonctionnalités" = [
      { "Héritage de scène" = "godot/scene-heritee.md" }
    ]}
  ]}
]


extra_css = [
  "assets/css/hint.min.css",
  "assets/css/override.css",
  "assets/css/course-header.css"
]

extra_javascript = [
  "assets/javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
  "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.7/contrib/auto-render.min.js"
]

[project.theme]
# variant = "classic"
custom_dir = "overrides"
# favicon = "images/favicon.png"
language = "fr"
features = [
  "announce.dismiss",
  # "content.action.edit",
  # "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  # "header.autohide",
  "navigation.expand",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  #"navigation.instant.progress",
  "navigation.path",
  "navigation.prune",
  "navigation.sections",
  "navigation.tabs",
  # "navigation.tabs.sticky",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
  "toc.integrate",
]

# logo = "assets/logo.png"

# [project.theme.icon]
# logo = "lucide/smile"

# [project.theme.font]
# text = "Inter"
# code = "Jetbrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/linkedin"
link = "https://www.linkedin.com/in/alexandre-ouellet-b7420295/"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/thecakeisreal"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.blocks.caption = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
# pymdownx.snippets.base_path = "includes"
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
tables = {}
course_summary = {}